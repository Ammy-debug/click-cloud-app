name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Prepare Web Directory & Copy HTML
        run: |
          mkdir -p www
          HTML_FILE=$(find . -maxdepth 2 -iname "*.html*" ! -path "./www/*" | head -n 1)
          if [ -n "$HTML_FILE" ]; then
            echo "Found HTML file: $HTML_FILE"
            cp "$HTML_FILE" www/index.html
          else
            echo "Error: Koi bhi HTML file nahi mili!"
            exit 1
          fi
          npm install

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Generate Complete Android Adaptive & Legacy App Icons
        run: |
          # 1. Update App Name to WED+CAL
          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS_FILE" ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">WED+CAL<\/string>/g' "$STRINGS_FILE"
            sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">WED+CAL<\/string>/g' "$STRINGS_FILE"
          fi

          # 2. Locate Logo Image
          LOGO_SRC=$(find . -maxdepth 2 -iname "*logo*.png" -o -iname "*icon*.png" -o -iname "1786*.png" | head -n 1)
          
          if [ -n "$LOGO_SRC" ]; then
            echo "Processing Logo from: $LOGO_SRC"
            RES_DIR="android/app/src/main/res"

            # Clean and recreate anydpi-v26 adaptive icon XMLs
            mkdir -p "$RES_DIR/mipmap-anydpi-v26"
            cat << 'EOF' > "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml"
<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@color/ic_launcher_background"/>
    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
</adaptive-icon>
EOF

            cat << 'EOF' > "$RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml"
<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@color/ic_launcher_background"/>
    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
</adaptive-icon>
EOF

            # Set dark background color for adaptive canvas
            mkdir -p "$RES_DIR/values"
            cat << 'EOF' > "$RES_DIR/values/ic_launcher_background.xml"
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="ic_launcher_background">#11080a</color>
</resources>
EOF

            declare -A SIZES=( ["mipmap-mdpi"]=48 ["mipmap-hdpi"]=72 ["mipmap-xhdpi"]=96 ["mipmap-xxhdpi"]=144 ["mipmap-xxxhdpi"]=192 )
            declare -A FG_SIZES=( ["mipmap-mdpi"]=108 ["mipmap-hdpi"]=162 ["mipmap-xhdpi"]=216 ["mipmap-xxhdpi"]=324 ["mipmap-xxxhdpi"]=432 )

            for FOLDER in "${!SIZES[@]}"; do
              SIZE=${SIZES[$FOLDER]}
              FG_SIZE=${FG_SIZES[$FOLDER]}
              mkdir -p "$RES_DIR/$FOLDER"
              
              # Standard launcher icon
              convert "$LOGO_SRC" -resize ${SIZE}x${SIZE} "$RES_DIR/$FOLDER/ic_launcher.png"
              # Round launcher icon
              convert "$LOGO_SRC" -resize ${SIZE}x${SIZE} "$RES_DIR/$FOLDER/ic_launcher_round.png"
              # Adaptive icon foreground layer with center padding
              convert "$LOGO_SRC" -resize ${FG_SIZE}x${FG_SIZE} -gravity center -background none "$RES_DIR/$FOLDER/ic_launcher_foreground.png"
            done
            echo "✓ Complete Android Adaptive Icon Engine executed successfully!"
          else
            echo "⚠️ ERROR: logo.png file nahi mili repository me!"
            exit 1
          fi

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: WED-CAL-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
