name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup ImageMagick & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick python3

      - name: Prepare Web Directory & Copy HTML
        run: |
          mkdir -p www
          HTML_FILE=$(find . -maxdepth 2 -iname "*.html*" ! -path "./www/*" | head -n 1)
          if [ -n "$HTML_FILE" ]; then
            echo "Found HTML file: $HTML_FILE"
            cp "$HTML_FILE" www/index.html
          else
            echo "Error: Koi HTML file nahi mili!"
            exit 1
          fi
          npm install

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Force Generate & Replace All Android Icons
        run: |
          python3 -c '
          import os, glob, subprocess

          # 1. Update App Name to WED+CAL
          strings_path = "android/app/src/main/res/values/strings.xml"
          if os.path.exists(strings_path):
              with open(strings_path, "r", encoding="utf-8") as f:
                  content = f.read()
              import re
              content = re.sub(r"<string name=\"app_name\">.*?</string>", "<string name=\"app_name\">WED+CAL</string>", content)
              content = re.sub(r"<string name=\"title_activity_main\">.*?</string>", "<string name=\"title_activity_main\">WED+CAL</string>", content)
              with open(strings_path, "w", encoding="utf-8") as f:
                  f.write(content)

          # 2. Find any image uploaded in the repo
          images = glob.glob("./*.png") + glob.glob("./*.jpg") + glob.glob("./*/*.png") + glob.glob("./*/*.jpg")
          valid_images = [img for img in images if not img.startswith("./android") and not img.startswith("./.git")]

          if not valid_images:
              print("❌ ERROR: Koi bhi image/logo nahi mili repo me!")
              exit(1)

          logo_src = valid_images[0]
          print(f"Applying Logo: {logo_src}")

          res_dir = "android/app/src/main/res"

          # 3. Overwrite all mipmap launcher PNGs
          sizes = {
              "mipmap-mdpi": (48, 108),
              "mipmap-hdpi": (72, 162),
              "mipmap-xhdpi": (96, 216),
              "mipmap-xxhdpi": (144, 324),
              "mipmap-xxxhdpi": (192, 432)
          }

          for folder, (size, fg_size) in sizes.items():
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              subprocess.run(["convert", logo_src, "-resize", f"{size}x{size}!", os.path.join(target_dir, "ic_launcher.png")])
              subprocess.run(["convert", logo_src, "-resize", f"{size}x{size}!", os.path.join(target_dir, "ic_launcher_round.png")])
              subprocess.run(["convert", logo_src, "-resize", f"{fg_size}x{fg_size}!", os.path.join(target_dir, "ic_launcher_foreground.png")])

          # 4. Overwrite anydpi-v26 to use direct foreground without missing layers
          anydpi_dir = os.path.join(res_dir, "mipmap-anydpi-v26")
          os.makedirs(anydpi_dir, exist_ok=True)
          adaptive_xml = """<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@color/ic_launcher_background"/>
    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
</adaptive-icon>"""

          with open(os.path.join(anydpi_dir, "ic_launcher.xml"), "w") as f:
              f.write(adaptive_xml)
          with open(os.path.join(anydpi_dir, "ic_launcher_round.xml"), "w") as f:
              f.write(adaptive_xml)

          # 5. Overwrite background color to match gold/dark theme
          values_dir = os.path.join(res_dir, "values")
          os.makedirs(values_dir, exist_ok=True)
          with open(os.path.join(values_dir, "ic_launcher_background.xml"), "w") as f:
              f.write("""<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="ic_launcher_background">#11080a</color>
</resources>""")

          print("✓ Logo perfectly baked into Android APK!")
          '

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: WED-CAL-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
