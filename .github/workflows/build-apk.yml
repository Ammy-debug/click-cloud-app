name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup ImageMagick & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick python3

      - name: Prepare Web Directory & Copy HTML
        run: |
          mkdir -p www
          HTML_FILE=$(find . -maxdepth 2 -iname "*.html*" ! -path "./www/*" | head -n 1)
          if [ -n "$HTML_FILE" ]; then
            echo "Found HTML file: $HTML_FILE"
            cp "$HTML_FILE" www/index.html
          else
            echo "Error: Koi HTML file nahi mili!"
            exit 1
          fi
          npm install

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Run Icon Generator
        run: |
          python3 make_icons.py

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: WED-CAL-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
