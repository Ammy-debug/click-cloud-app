name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Prepare Web Directory & Copy HTML
        run: |
          mkdir -p www
          HTML_FILE=$(find . -maxdepth 2 -iname "*.html*" ! -path "./www/*" | head -n 1)
          if [ -n "$HTML_FILE" ]; then
            echo "Found HTML file: $HTML_FILE"
            cp "$HTML_FILE" www/index.html
          else
            echo "Error: Koi bhi HTML file nahi mili!"
            exit 1
          fi
          npm install

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Set App Name to WED+CAL & Generate App Icons
        run: |
          # 1. Update Android Strings for App Display Name
          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS_FILE" ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">WED+CAL<\/string>/g' "$STRINGS_FILE"
            sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">WED+CAL<\/string>/g' "$STRINGS_FILE"
            echo "✓ App display name updated to WED+CAL in strings.xml"
          fi

          # 2. Force-Apply 3D Logo to Android Mipmaps
          LOGO_SRC=$(find . -maxdepth 2 -iname "*logo*.png" -o -iname "*icon*.png" -o -iname "1786*.png" | head -n 1)
          
          if [ -n "$LOGO_SRC" ]; then
            echo "Using Logo Image: $LOGO_SRC"
            RES_DIR="android/app/src/main/res"

            # Remove adaptive XMLs that block direct PNG display
            find "$RES_DIR" -name "ic_launcher.xml" -delete || true
            find "$RES_DIR" -name "ic_launcher_round.xml" -delete || true

            declare -A SIZES=( ["mipmap-mdpi"]=48 ["mipmap-hdpi"]=72 ["mipmap-xhdpi"]=96 ["mipmap-xxhdpi"]=144 ["mipmap-xxxhdpi"]=192 )
            declare -A FG_SIZES=( ["mipmap-mdpi"]=108 ["mipmap-hdpi"]=162 ["mipmap-xhdpi"]=216 ["mipmap-xxhdpi"]=324 ["mipmap-xxxhdpi"]=432 )

            for FOLDER in "${!SIZES[@]}"; do
              SIZE=${SIZES[$FOLDER]}
              FG_SIZE=${FG_SIZES[$FOLDER]}
              mkdir -p "$RES_DIR/$FOLDER"
              
              convert "$LOGO_SRC" -resize ${SIZE}x${SIZE} "$RES_DIR/$FOLDER/ic_launcher.png"
              convert "$LOGO_SRC" -resize ${SIZE}x${SIZE} "$RES_DIR/$FOLDER/ic_launcher_round.png"
              convert "$LOGO_SRC" -resize ${FG_SIZE}x${FG_SIZE} "$RES_DIR/$FOLDER/ic_launcher_foreground.png"
            done
            echo "✓ App Icons successfully replaced everywhere!"
          else
            echo "⚠️ Logo image nahi mili!"
          fi

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: WED-CAL-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
